services:
  mongodb:
    image: mongo:6.0
    container_name: saas_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - saas_net
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: saas_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - saas_net
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb
      - redis
    networks:
      - saas_net
    environment:
      # Internal Docker URLs
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      # App Config
      - SECRET_KEY=${SECRET_KEY}
      - CHAT_MAX_HISTORY_TURNS=${CHAT_MAX_HISTORY_TURNS:-10}
      - INVITE_TOKEN_EXPIRE_DAYS=${INVITE_TOKEN_EXPIRE_DAYS:-3}
      # LLM Gateway Keys
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_MAX_TOKENS=${GROQ_MAX_TOKENS:-1024}
      - GROQ_TEMPERATURE=${GROQ_TEMPERATURE:-0.7}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://127.0.0.1:8000}
    container_name: saas_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - saas_net
    restart: unless-stopped

networks:
  saas_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
